# DOSBox-X config for the Zeliard oracle (docs/HARNESS.md §6).
# Used by tools/oracle.sh, which replaces @DOSDIR@ with the staged game directory.
# Everything here exists to make emulated time a pure function of the inputs.
[sdl]
output=surface
autolock=false

[dosbox]
machine=svga_s3
memsize=16
# the BIOS logo waits on the HOST clock; skipping it is required for determinism
fastbioslogo=true

[render]
frameskip=10

[cpu]
core=normal
cputype=386
# 3000 cycles/ms = the cycles every DOSBox capture in docs/ was taken with
# (84.5 ms frame at speed 5); the game's frame work fits easily, so no frame overruns
cycles=fixed 3000
# turbo = no frame limiter: emulated ms run back to back, as fast as the host can
turbo=true
stop turbo on key=false

[mixer]
nosound=true

[joystick]
joysticktype=none

[autoexec]
mount c @DOSDIR@
c:
cd zeliard
zeliard
