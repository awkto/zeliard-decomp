# Web build of the C port (Emscripten + ASYNCIFY).  Code only: the artifact has
# no game data; the player picks their own copy in the page.
name: Web build

on:
  push:
    branches:
      - 'ci/web*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:3.1.64
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./packaging/web/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: zeliard-web
          path: build/web/
